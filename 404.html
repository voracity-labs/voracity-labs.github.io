<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Voracity Labs</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f7f5;
      --bg-grid: #e4e4e0;
      --text: #111111;
      --text-muted: #6b6b6b;
      color-scheme: light;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-block-size: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background-color: var(--bg);
      background-image:
        linear-gradient(var(--bg-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
      background-size: 28px 28px;
      color: var(--text);
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      font-size: 1rem;
      line-height: 1.6;
    }
    main { max-inline-size: 36rem; text-align: center; }
    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
      font-weight: 600;
    }
    p { margin: 0 0 2rem; color: var(--text-muted); }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-block-size: 44px;
      min-inline-size: 44px;
      padding: 0.625rem 1.25rem;
      border: 1px solid var(--text);
      border-radius: 4px;
      background: var(--text);
      color: var(--bg);
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    a:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>The page you were looking for doesn't exist or has moved.</p>
    <a href="/">Back to Voracity Labs</a>
  </main>
</body>
</html>
